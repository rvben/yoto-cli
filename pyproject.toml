[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "yoto-cli"
dynamic = ["version"]
description = "Manage Yoto Make Your Own playlists from the command line: sign in, upload audio, create and inspect content."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ruben J. Jongejan <ruben.jongejan@gmail.com>" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rvben/yoto-cli"
Repository = "https://github.com/rvben/yoto-cli"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
