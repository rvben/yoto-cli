[package]
name = "yoto-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Manage Yoto Make Your Own playlists from the command line: sign in, upload audio, create and inspect content."
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/yoto-cli"
homepage = "https://github.com/rvben/yoto-cli"
keywords = ["cli", "yoto", "audio", "playlist"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "yoto_cli"
path = "src/lib.rs"

[[bin]]
name = "yoto-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "vendored", "crypto-rust", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
mockito = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
